<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cathack.cc</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="cathack.cc home">
      <img src="cat-svgrepo-com.svg" alt="" />
      <span>cathack.cc</span>
    </a>

    <a class="toplink" href="https://discord.gg/5JfmX6CuQY" target="_blank" rel="noopener noreferrer">
      Request access
    </a>
  </header>

  <main class="page">
    <section class="hero" aria-labelledby="site-title">
      <img class="cat" src="cat-svgrepo-com.svg" alt="cathack cat logo" />

      <h1 id="site-title" data-text="CATHACK.CC">CATHACK.CC</h1>

      <div class="request-panel">
        <h2>Welcome to Cathack</h2>
      </div>
    </section>
  </main>

  <div class="enter-screen" id="enterScreen">
    <button class="enter-button" id="enterButton" type="button">
      <img src="cat-svgrepo-com.svg" alt="" />
      <span>click to enter</span>
    </button>
  </div>

  <audio id="enterSound" src="cathack.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
